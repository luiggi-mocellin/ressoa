services:
  - type: web
    name: ressoa
    runtime: node
    plan: free
    buildCommand: echo "sem dependencias"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Opcional: servidor TURN para redes que bloqueiam conexão direta.
      - key: TURN_URLS
        sync: false
      # Preferido: segredo compartilhado com o coturn (use-auth-secret) -> credenciais temporárias.
      - key: TURN_SECRET
        sync: false
      # Alternativa legada (usuário/senha fixos, entregues a todo usuário logado).
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
