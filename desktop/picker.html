<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Compartilhar tela</title>
  <style>
    :root { --bg:#0b0d12; --panel:#12151d; --panel2:#181c26; --line:#262b3a; --text:#e7eaf2; --muted:#8b93a7; --accent:#2dd4bf; --ink:#04201c; color-scheme: dark; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--panel); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
    header { padding: 16px 20px 0; }
    h1 { margin: 0 0 12px; font-size: 18px; }
    .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); }
    .tabs button { background: none; border: 0; color: var(--muted); padding: 8px 12px; font: inherit; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; }
    .tabs button.on { color: var(--text); border-color: var(--accent); }
    main { flex: 1; overflow-y: auto; padding: 16px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; align-content: start; }
    .src { background: var(--panel2); border: 2px solid transparent; border-radius: 12px; padding: 8px; cursor: pointer; display: grid; gap: 8px; text-align: left; color: inherit; font: inherit; }
    .src:hover { border-color: var(--line); }
    .src.sel { border-color: var(--accent); }
    .thumb { aspect-ratio: 16 / 9; border-radius: 8px; background: #000 center / contain no-repeat; }
    .name { display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .name img { width: 16px; height: 16px; flex: none; }
    .name span { overflow: hidden; text-overflow: ellipsis; }
    footer { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
    .audio { display: grid; gap: 2px; margin-right: auto; }
    .audio label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .audio input { accent-color: var(--accent); width: 16px; height: 16px; }
    .audio small { color: var(--muted); }
    button.act { border: 0; border-radius: 10px; padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer; }
    .cancel { background: transparent; color: var(--muted); }
    .go { background: var(--accent); color: var(--ink); }
    .go:disabled { opacity: .4; cursor: default; }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>O que você quer compartilhar?</h1>
    <div class="tabs">
      <button id="t-screen" class="on" type="button">Telas</button>
      <button id="t-window" type="button">Janelas</button>
    </div>
  </header>
  <main id="grid"></main>
  <footer>
    <div class="audio" id="audio-box">
      <label><input type="checkbox" id="audio" /> Compartilhar o áudio do computador</label>
      <small>Envia o som dos outros programas (jogo, música, vídeo). As vozes da chamada ficam de fora.</small>
    </div>
    <button class="act cancel" id="cancel" type="button">Cancelar</button>
    <button class="act go" id="go" type="button" disabled>Compartilhar</button>
  </footer>
  <script>
    let all = [];
    let kind = 'screen';
    let selected = null;
    const grid = document.getElementById('grid');
    const go = document.getElementById('go');

    function render() {
      grid.replaceChildren();
      const list = all.filter((s) => s.kind === kind);
      if (!list.length) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = kind === 'screen' ? 'Nenhuma tela encontrada.' : 'Nenhuma janela aberta para compartilhar.';
        grid.append(p);
      }
      for (const s of list) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'src' + (s.id === selected ? ' sel' : '');
        const t = document.createElement('div');
        t.className = 'thumb';
        if (s.thumb) t.style.backgroundImage = 'url("' + s.thumb + '")';
        const n = document.createElement('div');
        n.className = 'name';
        if (s.icon) { const i = document.createElement('img'); i.src = s.icon; i.alt = ''; n.append(i); }
        const sp = document.createElement('span');
        sp.textContent = s.name;
        n.append(sp);
        b.append(t, n);
        b.addEventListener('click', () => { selected = s.id; go.disabled = false; render(); });
        b.addEventListener('dblclick', () => share(s.id));
        grid.append(b);
      }
    }
    function setKind(k) {
      kind = k;
      document.getElementById('t-screen').classList.toggle('on', k === 'screen');
      document.getElementById('t-window').classList.toggle('on', k === 'window');
      render();
    }
    function share(id) { window.picker.choose(id, document.getElementById('audio').checked); }

    document.getElementById('t-screen').onclick = () => setKind('screen');
    document.getElementById('t-window').onclick = () => setKind('window');
    document.getElementById('cancel').onclick = () => window.picker.cancel();
    go.onclick = () => selected && share(selected);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.picker.cancel(); });

    window.picker.sources().then(({ sources, audioRequested, canAudio }) => {
      all = sources;
      const box = document.getElementById('audio-box');
      box.hidden = !(audioRequested && canAudio);
      render();
    });
  </script>
</body>
</html>
